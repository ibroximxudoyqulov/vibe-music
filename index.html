<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeStudio - Karaoke & Aesthetic Lyrics Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { red: '#ff2a5f', cyan: '#00f2fe', dark: '#09090d', card: '#13131c', input: '#1c1c28', yellow: '#face15' }
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- GOOGLE FONTS (70+ SHRIFTLAR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@700&family=Cormorant+Garamond:ital,wght@1,700&family=Great+Vibes&family=Lobster&family=Montserrat:wght@800&family=Neucha&family=Pacifico&family=Playfair+Display:ital,wght@1,800&family=Press+Start+2P&family=Ruslan+Display&family=Russo+One&family=Underdog&family=Yeseva+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #09090d; color: #ffffff; user-select: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass { background: rgba(19, 19, 28, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .vinyl-spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- ==================== HEADER (TIL ALMASHTIRISH BILAN) ==================== -->
    <header class="p-4 glass sticky top-0 z-30 flex justify-between items-center border-b border-gray-800/60">
        <div class="flex items-center space-x-2">
            <span class="text-brand-red text-xl"><i class="fa-solid fa-compact-disc vinyl-spin"></i></span>
            <span id="txt-app-title" class="font-bold text-lg tracking-wide bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">VibeStudio</span>
        </div>
        <div class="flex items-center space-x-2.5">
            <!-- 2 TILLI TUGMA (UZ / RU) -->
            <button onclick="toggleAppLanguage()" id="btn-lang-toggle" class="px-2.5 py-1 bg-brand-input border border-gray-700 rounded-full text-xs font-bold text-gray-300 active:scale-95 transition">
                🇺🇿 UZ
            </button>

            <!-- HAMYON BALANSI -->
            <button onclick="openWalletModal()" class="px-3 py-1 bg-brand-input border border-yellow-500/30 rounded-full flex items-center space-x-1.5 active:scale-95 transition">
